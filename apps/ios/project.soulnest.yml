# SoulNest branding overlay for the upstream OpenClaw iOS project.
# Generate with: ./generate-soulnest-project.sh

options:
  bundleIdPrefix: com.wildenstudio

targets:
  OpenClaw:
    settings:
      base:
        OPENCLAW_URL_SCHEME: soulnest
      configs:
        Debug:
          OPENCLAW_URL_SCHEME: soulnest-debug
    info:
      properties:
        CFBundleDisplayName: SoulNest
        CFBundleURLTypes:
          - CFBundleURLName: com.wildenstudio.soulnest
            CFBundleURLSchemes:
              - "$(OPENCLAW_URL_SCHEME)"
        NSLocalNetworkUsageDescription: SoulNest discovers and connects to your OpenClaw Gateway on the local network.
        NSCameraUsageDescription: SoulNest uses the camera when you scan an OpenClaw Gateway setup QR code or explicitly share a photo or short video with your paired assistant.
        NSCalendarsUsageDescription: SoulNest uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsFullAccessUsageDescription: SoulNest uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsWriteOnlyAccessUsageDescription: SoulNest uses your calendars to add events when you enable calendar access.
        NSContactsUsageDescription: SoulNest uses your contacts so you can search and reference people while using your assistant.
        NSLocationWhenInUseUsageDescription: SoulNest uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: SoulNest can share your location in the background when you explicitly enable Always.
        NSMicrophoneUsageDescription: SoulNest uses the microphone for realtime chat, voice wake, push-to-talk, and voice notes.
        NSMotionUsageDescription: SoulNest may use motion data to support device-aware interactions and automations.
        NSHealthShareUsageDescription: SoulNest reads the health data you select to create summaries you request and sends those summaries through your OpenClaw Gateway to your configured AI provider.
        NSHealthUpdateUsageDescription: SoulNest does not write to Apple Health. It uses read-only data to create summaries you request.
        NSPhotoLibraryUsageDescription: SoulNest lets you choose photos to share with your assistant and save images you explicitly select.
        NSRemindersFullAccessUsageDescription: SoulNest uses your reminders to list, add, and complete tasks when you enable reminders access.
        NSSpeechRecognitionUsageDescription: SoulNest uses on-device speech recognition for talk mode and voice wake.

  OpenClawShareExtension:
    info:
      properties:
        CFBundleDisplayName: SoulNest Share

  OpenClawActivityWidget:
    info:
      properties:
        CFBundleDisplayName: SoulNest Activity

  OpenClawWatchApp:
    info:
      properties:
        CFBundleDisplayName: SoulNest
        NSLocalNetworkUsageDescription: SoulNest connects this Apple Watch to your OpenClaw Gateway on trusted local networks.
