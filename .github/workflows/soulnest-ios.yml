name: SoulNest iOS

on:
  pull_request:
    paths:
      - ".github/workflows/soulnest-ios.yml"
      - "apps/ios/**"
      - "apps/shared/**"
      - "apps/swabble/**"
      - "config/swiftformat"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/ios-*.sh"
      - "scripts/ios-*.mjs"
      - "scripts/ios-*.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/soulnest-ios.yml"
      - "apps/ios/**"
      - "apps/shared/**"
      - "apps/swabble/**"
      - "config/swiftformat"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/ios-*.sh"
      - "scripts/ios-*.mjs"
      - "scripts/ios-*.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soulnest-ios-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    name: iOS Simulator Build and Launch
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Report toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          node --version

      # The iOS metadata scripts import tsx from the repository dependency tree.
      - name: Install locked Node dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Install XcodeGen and Swift tools
        run: |
          set -euo pipefail
          brew install xcodegen swiftformat swiftlint
          xcodegen --version
          swiftformat --version
          swiftlint version

      - name: Prepare generated iOS metadata
        run: |
          set -euo pipefail
          ./scripts/ios-write-version-xcconfig.sh

      - name: Generate SoulNest project and icon variants
        run: |
          set -euo pipefail
          cd apps/ios
          ./generate-soulnest-project.sh

      - name: Validate SoulNest brand identity
        run: |
          set -euo pipefail
          release_set=apps/ios/Sources/Assets.xcassets/AppIcon.appiconset
          debug_set=apps/ios/Sources/Assets.xcassets/AppIconDebug.appiconset
          release_icon="$release_set/1024.png"
          release_dark="$release_set/1024-dark.png"
          debug_icon="$debug_set/1024.png"
          debug_dark="$debug_set/1024-dark.png"
          build_settings="$RUNNER_TEMP/soulnest-debug-build-settings.txt"

          plutil -lint apps/ios/Sources/Info.plist
          xcodebuild \
            -project apps/ios/OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -showBuildSettings > "$build_settings"
          grep -Eq '^[[:space:]]*INFOPLIST_KEY_CFBundleDisplayName = SoulNest$' "$build_settings"
          grep -Eq '^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER = com\.wildenstudio\.soulnest\.debug$' "$build_settings"
          grep -Eq '^[[:space:]]*OPENCLAW_URL_SCHEME = soulnest-debug$' "$build_settings"
          grep -Eq '^[[:space:]]*OPENCLAW_APP_GROUP_ID = group\.com\.wildenstudio\.soulnest\.shared$' "$build_settings"
          grep -Fq 'OPENCLAW_APP_BUNDLE_ID = com.wildenstudio.soulnest' apps/ios/Signing.xcconfig
          grep -Fq 'OPENCLAW_APP_GROUP_ID = group.com.wildenstudio.soulnest.shared' apps/ios/Signing.xcconfig
          grep -Fq '"value": "dark"' "$release_set/Contents.json"
          grep -Fq '"value": "tinted"' "$release_set/Contents.json"
          grep -Fq '"value": "dark"' "$debug_set/Contents.json"
          grep -Fq '"value": "tinted"' "$debug_set/Contents.json"

          for icon in "$release_icon" "$release_dark" "$debug_icon" "$debug_dark"; do
            test -s "$icon"
            test "$(sips -g pixelWidth "$icon" | awk '/pixelWidth/ {print $2}')" = "1024"
            test "$(sips -g pixelHeight "$icon" | awk '/pixelHeight/ {print $2}')" = "1024"
            test "$(sips -g hasAlpha "$icon" | awk '/hasAlpha/ {print $2}')" = "no"
          done

      - name: Build SoulNest for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/ios/OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Select iOS Simulator device
        id: simulator
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices")
            candidates = devices.values.flatten.select { |device| device["isAvailable"] && device["name"].start_with?("iPhone") }
            preferred = candidates.find { |device| device["name"] == "iPhone 17 Pro" } || candidates.first
            abort "No available iPhone simulator" unless preferred
            puts preferred.fetch("udid")
          ')"
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$device_id" -b || xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b

      - name: Run SoulNest core unit tests
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/SoulNestTestResults"
          log_file="$RUNNER_TEMP/soulnest-xcodebuild-test.log"
          mkdir -p "$results_dir"
          set -o pipefail
          xcodebuild \
            -project apps/ios/OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.device_id }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -parallel-testing-enabled NO \
            -resultBundlePath "$results_dir/SoulNest.xcresult" \
            -only-testing:OpenClawTests/SessionKeyTests \
            -only-testing:OpenClawTests/SoulNestAgentProfileTests \
            -only-testing:OpenClawTests/SoulNestConversationSessionStoreTests \
            -only-testing:OpenClawTests/SoulNestConversationLifecycleTests \
            -only-testing:OpenClawTests/SoulNestConversationCacheTests \
            -only-testing:OpenClawTests/SoulNestCharacterAssetTests \
            -only-testing:OpenClawTests/SoulNestCharacterAssetManifestTests \
            -only-testing:OpenClawTests/SoulNestCharacterAssetCacheTests \
            -only-testing:OpenClawTests/SoulNestCharacterAssetFileValidatorTests \
            -only-testing:OpenClawTests/SoulNestCharacterAssetIndexTests \
            -only-testing:OpenClawTests/SoulNestGatewaySessionTests \
            -only-testing:OpenClawTests/SoulNestOpenClawGatewayClientTests \
            -only-testing:OpenClawTests/SoulNestCharacterHomeViewTests \
            -only-testing:OpenClawTests/SoulNestImmersiveChatStoreTests \
            -only-testing:OpenClawTests/SoulNestImmersiveHomeSmokeTests \
            test | tee "$log_file"

      - name: Upload SoulNest unit test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: soulnest-unit-tests
          path: |
            ${{ runner.temp }}/SoulNestTestResults/*.xcresult
            ${{ runner.temp }}/soulnest-xcodebuild-test.log
          if-no-files-found: warn
          retention-days: 14

      - name: Install and launch SoulNest in Simulator
        run: |
          set -euo pipefail
          derived_data="$RUNNER_TEMP/SoulNestDerivedData"
          xcodebuild \
            -project apps/ios/OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.device_id }}" \
            -derivedDataPath "$derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          app_path="$(find "$derived_data/Build/Products" -type d -name 'OpenClaw.app' -print -quit)"
          test -n "$app_path"
          xcrun simctl install "${{ steps.simulator.outputs.device_id }}" "$app_path"
          xcrun simctl launch "${{ steps.simulator.outputs.device_id }}" com.wildenstudio.soulnest.debug
