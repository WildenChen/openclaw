name: iOS Periphery Dead Code

on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "apps/shared/OpenClawKit/Sources/**"
      - "apps/swabble/Sources/SwabbleKit/**"
      - "config/swiftformat"
      - "config/swiftlint.yml"
      - ".github/workflows/ios-periphery.yml"
      - "scripts/check-swift-tools.sh"
      - "scripts/format-swift.sh"
      - "scripts/install-swift-tools.sh"
      - "scripts/ios-write-swift-filelist.mjs"
      - "scripts/lint-swift.sh"
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency:
  group: ios-periphery-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  scan:
    name: Scan iOS dead code
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Verify Xcode
        run: |
          set -euo pipefail
          for xcode_app in /Applications/Xcode_26.5.app /Applications/Xcode-26.5.0.app; do
            if [ -d "$xcode_app/Contents/Developer" ]; then
              sudo xcode-select -s "$xcode_app/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          swift --version

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Install scan tooling
        run: |
          set -euo pipefail
          brew update
          brew install periphery
          swift_tools_dir="$RUNNER_TEMP/openclaw-swift-tools"
          ./scripts/install-xcodegen.sh "$swift_tools_dir"
          ./scripts/install-swift-tools.sh "$swift_tools_dir"
          echo "$swift_tools_dir" >> "$GITHUB_PATH"

      - name: Generate iOS project
        run: |
          set -euo pipefail
          ./scripts/ios-configure-signing.sh
          ./scripts/ios-write-version-xcconfig.sh
          node scripts/ios-write-swift-filelist.mjs
          cd apps/ios
          xcodegen generate

      - name: Run Periphery
        run: |
          set -euo pipefail
          cd apps/ios
          periphery scan --config .periphery.yml --strict
