name: macOS Periphery Dead Code

on:
  push:
    branches: [main]
    paths:
      - "apps/macos/**"
      - "apps/macos/.periphery.yml"
      - ".github/workflows/macos-periphery.yml"
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

concurrency:
  group: macos-periphery-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  scan:
    name: Scan macOS dead code
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Verify Xcode
        run: |
          set -euo pipefail
          for xcode_app in /Applications/Xcode_26.5.app /Applications/Xcode-26.5.0.app; do
            if [ -d "$xcode_app/Contents/Developer" ]; then
              sudo xcode-select -s "$xcode_app/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          swift --version

      - name: Install Periphery
        run: |
          set -euo pipefail
          brew update
          brew install periphery

      - name: Run Periphery
        run: |
          set -euo pipefail
          cd apps/macos
          periphery scan --config .periphery.yml --strict
